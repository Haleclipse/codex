[package]
edition.workspace = true
license.workspace = true
name = "codex-client"
version.workspace = true

[dependencies]
codex-http-client = { workspace = true }
eventsource-stream = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tracing = { workspace = true }

[lints]
workspace = true

# @cometix: `record_retry!` in src/retry.rs calls `::tracing::event!` from inside
# a macro body, which cargo-shear's static analysis cannot see.
[package.metadata.cargo-shear]
ignored = ["tracing"]

[lib]
doctest = false
test = false
